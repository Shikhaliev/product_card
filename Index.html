<body>
    <button class="change-color-card-button">Поменять цвет одной карты</button>
    <button class = "change-color-all-card-button">Поменять цвет всех карт</button>
    <button class = "open-google-button">Открыть Google</button>
    <button class = "out-log-console">Вывод в консоль</button>
    <button class = "change-color-toggle">Смена цвета</button>
    
    <main class="catalog">
        <div class="container catalog__container">
            <h1 class="title catalog__title">Выбери свой продукт</h1>
    
                <ul class="products  clear-list">  
                    <template class = "products-template">
                        <li class="products__item card">
                            <img src="resource/image/photo_1.png" alt="Увлажняющий мусс" class ="card__image"></img>
                            <p class="card__category"></p>
                            <h2 class="card__name"></h2>
                            <div class="card__description">
                                <p ></p>
                            </div>

                            <div class="card__compound compound"> 
                                <span>Состав:</span>
                                <ul class="compound__structure">
                                    <li></li>
                                    <li></li>
                                    <li></li>
                                </ul>
                            </div>

                            <div class="card__price-block">
                                <b>Цена</b> <span></span> 
                            </div>
                        </li>
                    </template>
                </ul>
        </div>
    </main>
