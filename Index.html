<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/card-BEM.css">
    <link rel="stylesheet" href="style/compound-BEM.css">
    <link rel="stylesheet" href="style/catalog-BEM.css">
    <link rel="stylesheet" href="style/container.css">
    <link rel="stylesheet" href="style/clear-list.css">
    <link rel="stylesheet" href="style/products-BEM.css">
    <link rel="stylesheet" href="style/button-BEM.css">
    <link rel="stylesheet" href="style/button-style.css">
    <link rel="stylesheet" href="style/footer-BEM.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <button class="change-color-card-button">Поменять цвет одной карты</button>
    <button class = "change-color-all-card-button">Поменять цвет всех карт</button>
    <button class = "open-google-button">Открыть Google</button>
    <button class = "out-log-console">Вывод в консоль</button>
    <button class = "change-color-toggle">Смена цвета</button>
    
    <main class="catalog">
        <div class="container catalog__container">
            <h1 class="title catalog__title">Выбери свой продукт</h1>
    
                <ul class="products  clear-list">  
                    <template class="products-template">
                        <li class="products__item card">
                            <img class="card__image" src>
                            <p class="card__category"></p>
                            <h2 class="card__name"></h2>
                            <div class="card__description"></div>
                            <div class="card__compound compound"> 
                                <span>Состав:</span>
                                <ul class="compound__structure"></ul>
                            </div>

                            <div class="card__price-block">
                                <b>Цена</b> <span></span> 
                            </div>
                        </li>
                    </template>
                </ul>
        <footer class="footer__block">
            <div class="footer__top">
                <div class="footer__top-brending">
                    <h3>Product Cards</h3>
                    <p>У нас самые лучшие продукты для кожи!</p>
                    <div class="brending-link">
                        <img src="/resource/image/TG.svg" alt="">
                        <img src="/resource/image/VK.svg" alt="">
                    </div>
                </div>

                <div class="footer__top-mailing">
                    <p>Подпишись на наши акции:</p>
                    <form>
                        <input type="email" placeholder="Введите Email..." autocomplete>  
                    </form>
                </div>
                <div class="footer__top-navigation">
                    <nav>
                        <p>Быстрые сылки</p>
                        <a href="#" >Главная</a>
                        <a href="#" >Магазин</a>
                        <a href="#" >Контакты</a>
                    </nav>
                </div>
            </div>
            
            <div class="footer__bottom">
                <hr>
                <a class="footer__product-link">www.product-cards.com©all right reserve</a>
            </div>
        </footer>
        </div>

        
    </main>

    <script src="scripts/homework-10.js" type="module"></script>
    <script src="scripts/homework-11.js" type="module"></script>

</body>
</html>
